name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VetPulse Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Android Release & Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease

      - name: Rename APK Artifacts
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/VetPulse-Pro-debug.apk || true
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/VetPulse-Pro-release.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VetPulse-Pro-APK
          path: release-apks/*
          retention-days: 14

      - name: Create Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VetPulse Pro Android Release v1.0.${{ github.run_number }}
          body: |
            ## 🐾 VetPulse Pro - Android APK Release
            
            Download the pre-compiled Android APK directly to your phone:
            - **VetPulse-Pro-debug.apk**: Ready for instant sideloading on any Android device without signing.
            - **VetPulse-Pro-release.apk**: Production release build.
            
            ### Features included in this APK:
            - 3D Telemetry Matrix & Ward Bed Management
            - Offline PWA & Service Worker caching
            - Camera & prescription scanning permissions enabled
            - Fullscreen immersive UI with Day & Night modes
          files: |
            release-apks/VetPulse-Pro-debug.apk
            release-apks/VetPulse-Pro-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
