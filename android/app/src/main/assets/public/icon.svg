<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Holographic pulse wave in background -->
  <path d="M 40 256 L 140 256 L 180 160 L 220 340 L 260 210 L 290 280 L 320 256 L 472 256" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#glow)" />

  <!-- Center Heart & Medical Cross Emblem -->
  <g transform="translate(0, -10)">
    <!-- Paw Pad (Center Main) -->
    <path d="M 256 240 C 200 240 180 290 195 340 C 210 380 240 400 256 400 C 272 400 302 380 317 340 C 332 290 312 240 256 240 Z" fill="url(#pawGrad)" />
    
    <!-- Paw Toes -->
    <ellipse cx="170" cy="205" rx="30" ry="42" transform="rotate(-20 170 205)" fill="url(#pawGrad)" />
    <ellipse cx="225" cy="165" rx="28" ry="40" transform="rotate(-6 225 165)" fill="url(#pawGrad)" />
    <ellipse cx="287" cy="165" rx="28" ry="40" transform="rotate(6 287 165)" fill="url(#pawGrad)" />
    <ellipse cx="342" cy="205" rx="30" ry="42" transform="rotate(20 342 205)" fill="url(#pawGrad)" />

    <!-- Medical Cross in Center of Paw -->
    <path d="M 244 300 H 268 V 324 H 292 V 344 H 268 V 368 H 244 V 344 H 220 V 324 H 244 Z" fill="#0891b2" />
  </g>

  <!-- Pulse Line Accent in Foreground -->
  <path d="M 80 430 L 170 430 L 200 370 L 230 460 L 260 395 L 285 440 L 310 430 L 432 430" 
        fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Small sparkle -->
  <polygon points="380,100 388,118 406,126 388,134 380,152 372,134 354,126 372,118" fill="#67e8f9" />
</svg>
